services:
  api:
    build: .
    container_name: api
    restart: unless-stopped
    command: bash -c "cd /src/rest && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    volumes:
      - ./src:/src

  app:
    build: .
    container_name: app
    restart: unless-stopped
    command: bash -c "cd /src/app && yarn install && yarn start"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./src:/src

  mongo:
    build: .
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: /usr/bin/mongod --bind_ip 0.0.0.0

volumes:
  mongo-data: